openapi: 3.1.0
info:
  title: Programme Loader Sync API
  version: 1.0.0
  description: |
    HTTP contract for orchestrating `main_programme_loader_optimized.py`.
    The underlying script performs Moodle-to-PostgreSQL programme/module/student grade synchronization.

servers:
  - url: https://api.example.com
    description: Replace with your deployment base URL

tags:
  - name: Sync
    description: Trigger and monitor programme sync jobs
  - name: Moodle
    description: Moodle webservice functions invoked by the sync workflow

paths:
  /sync/programmes:
    post:
      tags: [Sync]
      operationId: startProgrammeSync
      summary: Start a programme sync run
      description: |
        Starts a sync equivalent to running:
        `python main_programme_loader_optimized.py --programme-name <name> --category-id <id> ...`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSyncRequest'
            examples:
              default:
                value:
                  programmeName: PDEML
                  categoryId: 614
                  workers: 8
                  maxStudents: 500
                  skipFinals: false
                  verboseApiTiming: false
                  dbBatchSize: 2000
                  reset: false
      responses:
        '202':
          description: Sync accepted and started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSyncResponse'
              examples:
                accepted:
                  value:
                    runId: 8842
                    status: running
                    startedAt: '2026-04-29T12:31:22Z'
                    notes: programme=ADFMT, modules=9, workers=8, skip_finals=False
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /sync/runs/{runId}:
    get:
      tags: [Sync]
      operationId: getSyncRun
      summary: Get sync run status
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Current sync run state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRun'
              examples:
                success:
                  value:
                    runId: 8842
                    status: success
                    startedAt: '2026-04-29T12:31:22Z'
                    finishedAt: '2026-04-29T12:42:05Z'
                    notes: students=2147, modules=9, skip_finals=False
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sync/runs:
    get:
      tags: [Sync]
      operationId: listSyncRuns
      summary: List recent sync runs
      parameters:
        - name: limit
          in: query
          required: false
          description: Number of runs to return
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: status
          in: query
          required: false
          description: Optional filter by run status
          schema:
            type: string
            enum: [running, success, failed]
      responses:
        '200':
          description: Recent runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncRun'
        '500':
          $ref: '#/components/responses/InternalError'

  /moodle/wsfunctions:
    get:
      tags: [Moodle]
      operationId: listInvokedMoodleWsFunctions
      summary: List Moodle endpoints invoked by the loader
      description: |
        Returns the Moodle `wsfunction` names invoked by the
        `main_programme_loader_optimized.py` workflow and helper calls.
      responses:
        '200':
          description: Moodle wsfunctions used by the sync process
          content:
            application/json:
              schema:
                type: object
                required: [baseUrl, functions]
                properties:
                  baseUrl:
                    type: string
                    format: uri
                    description: Moodle REST endpoint base URL
                  functions:
                    type: array
                    items:
                      $ref: '#/components/schemas/MoodleWsFunction'
              examples:
                invoked:
                  value:
                    baseUrl: https://regentonline.ac.za/webservice/rest/server.php
                    functions:
                      - name: gradereport_user_get_grade_items
                        purpose: Module gradebook retrieval
                      - name: gradereport_overview_get_course_grades
                        purpose: Optional per-student course totals pass
                      - name: core_course_get_courses_by_field
                        purpose: Primary module discovery by category
                      - name: core_course_get_courses
                        purpose: Resolve Moodle course details by id
                      - name: core_course_search_courses
                        purpose: Fallback module discovery by programme-name
                      - name: core_course_get_categories
                        purpose: Resolve category metadata for modules
                      - name: mod_quiz_get_quizzes_by_courses
                        purpose: Fetch quiz close dates by course module id
                      - name: mod_assign_get_assignments
                        purpose: Fetch assignment due dates by course module id
                      - name: core_user_get_users_by_field
                        purpose: Batch user profile lookup by id
                      - name: core_user_get_users
                        purpose: Fallback user profile lookup

components:
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      description: Sync run identifier (maps to `public.api_sync_run.sync_run_id`)
      schema:
        type: integer
        minimum: 1

  schemas:
    MoodleWsFunction:
      type: object
      additionalProperties: false
      required: [name, purpose]
      properties:
        name:
          type: string
          enum:
            - gradereport_user_get_grade_items
            - gradereport_overview_get_course_grades
            - core_course_get_courses_by_field
            - core_course_get_courses
            - core_course_search_courses
            - core_course_get_categories
            - mod_quiz_get_quizzes_by_courses
            - mod_assign_get_assignments
            - core_user_get_users_by_field
            - core_user_get_users
          description: Moodle `wsfunction` name
        purpose:
          type: string
          description: Why this function is used in the sync workflow

    StartSyncRequest:
      type: object
      additionalProperties: false
      required:
        - programmeName
        - categoryId
      properties:
        programmeName:
          type: string
          minLength: 2
          maxLength: 120
          description: Programme name used for module filtering (e.g. PDEML)
        seedCourseId:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Optional seed course id override (auto-selected if omitted)
        categoryId:
          type: integer
          minimum: 1
          description: Required Moodle category scope for module discovery
        workers:
          type: integer
          minimum: 1
          maximum: 64
          default: 8
          description: Parallel worker count for API calls
        maxStudents:
          type:
            - integer
            - 'null'
          minimum: 1
          description: Optional cap for quick test runs
        skipFinals:
          type: boolean
          default: false
          description: Skip per-student course total pass
        verboseApiTiming:
          type: boolean
          default: false
          description: Emit timing details for each Moodle API call
        dbBatchSize:
          type: integer
          minimum: 1
          maximum: 20000
          default: 2000
          description: Batch size for student_assessment writes
        reset:
          type: boolean
          default: false
          description: Truncate/reseed analytics tables before syncing

    StartSyncResponse:
      type: object
      required: [runId, status, startedAt]
      properties:
        runId:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [running]
        startedAt:
          type: string
          format: date-time
        notes:
          type: string

    SyncRun:
      type: object
      required: [runId, status, startedAt]
      properties:
        runId:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [running, success, failed]
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
        notes:
          type:
            - string
            - 'null'

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type:
            - string
            - 'null'

  responses:
    BadRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid:
              value:
                error: Invalid request
                details: programme is required

    Unauthorized:
      description: Authentication required/failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            auth:
              value:
                error: Unauthorized
                details: Missing or invalid token

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              value:
                error: Not found
                details: runId 999999 does not exist

    InternalError:
      description: Server-side execution error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            failed:
              value:
                error: Sync failed
                details: DB connection string missing in environment
